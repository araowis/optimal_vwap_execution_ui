<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @media (prefers-color-scheme: light) {
      .background { fill: #f5f5f5; }
      .foreground { fill: #333333; }
    }
    @media (prefers-color-scheme: dark) {
      .background { fill: #1a1a1a; }
      .foreground { fill: #e5e5e5; }
    }
  </style>
  <rect class="background" width="180" height="180" rx="20" />
  <g class="foreground" transform="translate(30, 40)">
    <!-- Chart line -->
    <path d="M0 80 L20 70 L40 75 L60 50 L80 60 L100 35 L120 45 L120 90 L0 90 Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Bar chart bars -->
    <rect x="10" y="50" width="15" height="40" rx="2"/>
    <rect x="35" y="35" width="15" height="55" rx="2"/>
    <rect x="60" y="45" width="15" height="45" rx="2"/>
    <rect x="85" y="25" width="15" height="65" rx="2"/>
    <rect x="110" y="40" width="15" height="50" rx="2"/>
  </g>
</svg>